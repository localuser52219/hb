<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habit Tracker Pro - Analytics Update</title>
    <!-- 引入 React 和 Babel -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 圖示組件定義 (包含新功能所需的圖示) -->
    <script type="text/babel">
        const Icons = {
            Calendar: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>,
            CheckCircle: ({className}) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>,
            Gift: ({className}) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="20 12 20 22 4 22 4 12"></polyline><rect x="2" y="7" width="20" height="5"></rect><line x1="12" y1="22" x2="12" y2="7"></line><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"></path><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"></path></svg>,
            Settings: ({className}) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>,
            Trash2: ({className}) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>,
            ChevronLeft: ({className}) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="15 18 9 12 15 6"></polyline></svg>,
            ChevronRight: ({className}) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="9 18 15 12 9 6"></polyline></svg>,
            Coins: ({className}) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="8"></circle><path d="M9.43 14c-.66.86-1.43 1.4-2.43 1.6-1.5.3-3-.4-3.5-1.9-.5-1.5.4-3 1.9-3.5 1-.33 2.1-.03 2.83.6"></path><path d="M14.57 14c.66.86 1.43 1.4 2.43 1.6 1.5.3 3-.4 3.5-1.9.5-1.5-.4-3-1.9-3.5-1-.33-2.1-.03-2.83.6"></path><path d="M12 8v8"></path></svg>,
            AlertCircle: ({className}) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>,
            Award: ({className}) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="8" r="7"></circle><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"></polyline></svg>,
            BarChart: ({className}) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>,
            ArrowUp: ({className}) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>,
            ArrowDown: ({className}) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="12" y1="5" x2="12" y2="19"></line><polyline points="19 12 12 19 5 12"></polyline></svg>
        };
    </script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            // --- 狀態管理 ---
            const [habits, setHabits] = useState(() => {
                const saved = localStorage.getItem('habits');
                if (saved) return JSON.parse(saved);
                return [{ id: 1, name: "每日閱讀 30 分鐘", points: 10, icon: '📚' }];
            });

            const [checkIns, setCheckIns] = useState(() => {
                const saved = localStorage.getItem('multiHabitCheckIns');
                if (saved) return JSON.parse(saved);
                return {};
            });

            const [points, setPoints] = useState(() => parseInt(localStorage.getItem('userPoints')) || 0);
            const [rewards, setRewards] = useState(() => JSON.parse(localStorage.getItem('rewards')) || [
                { id: 1, name: "喝一杯手搖飲", cost: 50 },
                { id: 2, name: "週末看電影", cost: 200 },
                { id: 3, name: "購買新遊戲", cost: 1000 }
            ]);
            const [history, setHistory] = useState(() => JSON.parse(localStorage.getItem('history')) || []);
            
            // 成就紀錄：修改為 Object 以儲存領取「次數」 { "first_blood": 1, "seven_days": 3 }
            const [claimedAchievements, setClaimedAchievements] = useState(() => {
                const saved = JSON.parse(localStorage.getItem('claimedAchievementsObj'));
                if (saved) return saved;
                
                // 向下相容舊版陣列
                const oldArray = JSON.parse(localStorage.getItem('claimedAchievements'));
                if (Array.isArray(oldArray)) {
                    const newObj = {};
                    oldArray.forEach(id => newObj[id] = 1);
                    return newObj;
                }
                return {};
            });

            const [activeTab, setActiveTab] = useState('calendar'); // 'calendar', 'shop', 'achievements', 'analytics', 'settings'
            const [viewDate, setViewDate] = useState(new Date());
            const [selectedDate, setSelectedDate] = useState(new Date());
            
            const [newHabitName, setNewHabitName] = useState("");
            const [newHabitPoints, setNewHabitPoints] = useState(10);
            const [newRewardName, setNewRewardName] = useState("");
            const [newRewardCost, setNewRewardCost] = useState(50);

            const [modalConfig, setModalConfig] = useState({ isOpen: false, title: "", message: "", onConfirm: null });
            const [toast, setToast] = useState({ show: false, message: "", type: "success" });

            // --- 數據持久化 ---
            useEffect(() => {
                localStorage.setItem('habits', JSON.stringify(habits));
                localStorage.setItem('multiHabitCheckIns', JSON.stringify(checkIns));
                localStorage.setItem('userPoints', points);
                localStorage.setItem('rewards', JSON.stringify(rewards));
                localStorage.setItem('history', JSON.stringify(history));
                localStorage.setItem('claimedAchievementsObj', JSON.stringify(claimedAchievements));
            }, [habits, checkIns, points, rewards, history, claimedAchievements]);

            useEffect(() => {
                if (toast.show) {
                    const timer = setTimeout(() => setToast({ ...toast, show: false }), 3000);
                    return () => clearTimeout(timer);
                }
            }, [toast.show]);

            // --- 輔助函式 ---
            const showToast = (message, type = "success") => setToast({ show: true, message, type });
            const openConfirmModal = (title, message, onConfirm) => setModalConfig({ isOpen: true, title, message, onConfirm });
            const closeConfirmModal = () => setModalConfig({ ...modalConfig, isOpen: false });

            const getDaysInMonth = (year, month) => new Date(year, month + 1, 0).getDate();
            const getFirstDayOfMonth = (year, month) => new Date(year, month, 1).getDay();
            const formatDateKey = (date) => `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
            
            // 取得近 30 天的日期字串陣列
            const getLast30Days = () => {
                const dates = [];
                const today = new Date();
                today.setHours(0,0,0,0);
                for (let i = 29; i >= 0; i--) {
                    const d = new Date(today);
                    d.setDate(d.getDate() - i);
                    dates.push(formatDateKey(d));
                }
                return dates;
            };

            // --- 業務邏輯 ---
            const toggleCheckIn = (habitId) => {
                const dateKey = formatDateKey(selectedDate);
                const recordKey = `${habitId}_${dateKey}`;
                const habit = habits.find(h => h.id === habitId);
                
                const today = new Date();
                today.setHours(0,0,0,0);
                const target = new Date(selectedDate);
                target.setHours(0,0,0,0);

                if (target > today) {
                    showToast("不能預支未來的努力喔！", "error");
                    return;
                }

                if (checkIns[recordKey]) {
                    const newCheckIns = { ...checkIns };
                    delete newCheckIns[recordKey];
                    setCheckIns(newCheckIns);
                    setPoints(prev => Math.max(0, prev - habit.points));
                } else {
                    setCheckIns({ ...checkIns, [recordKey]: true });
                    setPoints(prev => prev + habit.points);
                }
            };

            const addNewHabit = (e) => {
                e.preventDefault();
                if (!newHabitName.trim()) return;
                const newHabit = { id: Date.now(), name: newHabitName, points: parseInt(newHabitPoints) || 10, icon: '✨' };
                setHabits([...habits, newHabit]);
                setNewHabitName("");
                setNewHabitPoints(10);
                showToast("習慣新增成功！");
            };

            const deleteHabit = (id) => {
                openConfirmModal("刪除習慣", "確定要刪除這個習慣嗎？歷史打卡紀錄將失去關聯。", () => {
                    setHabits(habits.filter(h => h.id !== id));
                    showToast("習慣已刪除", "info");
                    closeConfirmModal();
                });
            };

            // 習慣排序邏輯
            const moveHabit = (index, direction) => {
                const newHabits = [...habits];
                if (direction === 'up' && index > 0) {
                    [newHabits[index - 1], newHabits[index]] = [newHabits[index], newHabits[index - 1]];
                } else if (direction === 'down' && index < newHabits.length - 1) {
                    [newHabits[index + 1], newHabits[index]] = [newHabits[index], newHabits[index + 1]];
                }
                setHabits(newHabits);
            };

            const addReward = (e) => {
                e.preventDefault();
                if (!newRewardName.trim()) return;
                setRewards([...rewards, { id: Date.now(), name: newRewardName, cost: parseInt(newRewardCost) }]);
                setNewRewardName("");
                setNewRewardCost(50);
                showToast("獎品新增成功！");
            };

            const deleteReward = (id) => setRewards(rewards.filter(r => r.id !== id));

            const redeemReward = (reward) => {
                if (points >= reward.cost) {
                    openConfirmModal("兌換獎品", `確定要花費 ${reward.cost} 點兌換「${reward.name}」嗎？`, () => {
                        setPoints(prev => prev - reward.cost);
                        setHistory([{ id: Date.now(), name: reward.name, cost: reward.cost, date: new Date().toISOString() }, ...history]);
                        showToast("兌換成功！享受你的獎勵吧！🎉");
                        closeConfirmModal();
                    });
                } else {
                    showToast("點數不足，繼續加油！💪", "error");
                }
            };

            // --- 成就系統邏輯 ---
            const claimAchievementReward = (achievement, timesToClaim = 1) => {
                const totalPoints = achievement.points * timesToClaim;
                setPoints(prev => prev + totalPoints);
                setClaimedAchievements(prev => ({
                    ...prev,
                    [achievement.id]: (prev[achievement.id] || 0) + timesToClaim
                }));
                showToast(`領取成就獎勵！獲得 ${totalPoints} 點 🎉`);
            };

            const getDailyCompletionRate = (dateKey) => {
                if (habits.length === 0) return 0;
                let completedCount = 0;
                habits.forEach(habit => { if (checkIns[`${habit.id}_${dateKey}`]) completedCount++; });
                return completedCount / habits.length;
            };

            // 動態計算成就狀態
            const totalCheckInsCount = Object.keys(checkIns).length;
            const totalRedeemCount = history.length;
            
            const achievementsList = [
                {
                    id: 'first_blood',
                    type: 'once',
                    title: '初試啼聲',
                    description: '完成應用程式的第一次打卡',
                    icon: '🥉',
                    points: 30,
                    progress: Math.min(totalCheckInsCount, 1),
                    target: 1
                },
                {
                    id: 'first_redeem',
                    type: 'once',
                    title: '享受成果',
                    description: '第一次兌換心儀的獎品',
                    icon: '🎁',
                    points: 50,
                    progress: Math.min(totalRedeemCount, 1),
                    target: 1
                },
                {
                    id: 'seven_days',
                    type: 'repeatable',
                    title: '每日挑戰者',
                    description: '每累積打卡 7 次即可領取一次',
                    icon: '🔥',
                    points: 100,
                    progress: totalCheckInsCount,
                    target: 7
                },
                {
                    id: 'redeem_master',
                    type: 'repeatable',
                    title: '兌換達人',
                    description: '每兌換 3 次獎品即可領取一次',
                    icon: '👑',
                    points: 150,
                    progress: totalRedeemCount,
                    target: 3
                }
            ];

            const renderAchievements = () => (
                <div className="space-y-6">
                    <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                        <div className="flex items-center justify-between mb-6">
                            <h3 className="text-xl font-bold text-gray-800 flex items-center">
                                <Icons.Award className="w-6 h-6 mr-2 text-indigo-600" /> 榮譽成就與任務
                            </h3>
                        </div>

                        <div className="space-y-4">
                            {achievementsList.map(achievement => {
                                const claimedCount = claimedAchievements[achievement.id] || 0;
                                
                                let isClaimable = false;
                                let timesClaimable = 0;
                                let isCompletedOnce = false;

                                if (achievement.type === 'once') {
                                    isCompletedOnce = achievement.progress >= achievement.target;
                                    isClaimable = isCompletedOnce && claimedCount === 0;
                                } else if (achievement.type === 'repeatable') {
                                    const totalPossibleClaims = Math.floor(achievement.progress / achievement.target);
                                    timesClaimable = totalPossibleClaims - claimedCount;
                                    isClaimable = timesClaimable > 0;
                                }

                                const isFullyClaimed = achievement.type === 'once' && claimedCount > 0;
                                const currentStepProgress = achievement.type === 'repeatable' 
                                    ? achievement.progress % achievement.target 
                                    : achievement.progress;

                                return (
                                    <div key={achievement.id} className={`flex items-center justify-between p-4 rounded-xl border transition-all ${
                                        isFullyClaimed ? 'bg-gray-50 border-gray-100 opacity-70' : 
                                        isClaimable ? 'bg-indigo-50/50 border-indigo-300 shadow-sm ring-1 ring-indigo-100' : 'bg-white border-gray-200'
                                    }`}>
                                        <div className="flex items-center gap-4">
                                            <div className={`w-12 h-12 rounded-full flex items-center justify-center text-2xl shadow-inner ${
                                                isFullyClaimed ? 'bg-gray-200 grayscale' : 'bg-gradient-to-br from-indigo-100 to-white'
                                            }`}>
                                                {achievement.icon}
                                            </div>
                                            <div>
                                                <div className="flex items-center gap-2">
                                                    <h4 className={`font-bold ${isFullyClaimed ? 'text-gray-500' : 'text-gray-800'}`}>{achievement.title}</h4>
                                                    {achievement.type === 'repeatable' && claimedCount > 0 && (
                                                        <span className="text-[10px] bg-yellow-100 text-yellow-700 px-2 py-0.5 rounded-full font-bold">已領 {claimedCount} 次</span>
                                                    )}
                                                </div>
                                                <p className="text-xs text-gray-500 mt-0.5">{achievement.description}</p>
                                                {!isFullyClaimed && !isClaimable && (
                                                    <p className="text-xs font-mono text-indigo-400 mt-1">
                                                        進度: {currentStepProgress} / {achievement.target}
                                                    </p>
                                                )}
                                            </div>
                                        </div>

                                        <div>
                                            {isFullyClaimed ? (
                                                <span className="text-sm font-bold text-gray-400 flex items-center bg-gray-100 px-3 py-1 rounded-lg">已領取</span>
                                            ) : isClaimable ? (
                                                <button 
                                                    onClick={() => claimAchievementReward(achievement, achievement.type === 'repeatable' ? timesClaimable : 1)}
                                                    className="text-sm font-bold text-white bg-indigo-600 hover:bg-indigo-700 px-4 py-2 rounded-lg shadow-md transition-transform transform hover:scale-105 animate-pulse whitespace-nowrap"
                                                >
                                                    領取 {achievement.type === 'repeatable' && timesClaimable > 1 ? `(${timesClaimable}次)` : ''} +{achievement.points * (achievement.type === 'repeatable' ? timesClaimable : 1)}
                                                </button>
                                            ) : (
                                                <span className="text-sm font-medium text-gray-300">未達成</span>
                                            )}
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                </div>
            );

            // --- 分析分頁邏輯 ---
            const renderAnalytics = () => {
                const last30Days = getLast30Days(); // ["2023-10-01", ..., "2023-10-30"]
                
                // 1. 準備貢獻圖資料
                const heatmapData = last30Days.map(dateKey => {
                    return { date: dateKey, rate: getDailyCompletionRate(dateKey) };
                });

                // 2. 準備圓餅圖資料 (近 30 天分數來源)
                const pieColors = ['#6366f1', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899', '#06b6d4'];
                let totalPoints30Days = 0;
                const pieData = habits.map((h, idx) => {
                    let pts = 0;
                    last30Days.forEach(date => {
                        if (checkIns[`${h.id}_${date}`]) pts += h.points;
                    });
                    totalPoints30Days += pts;
                    return { label: h.name, value: pts, color: pieColors[idx % pieColors.length] };
                }).filter(d => d.value > 0);

                // 繪製圓餅圖的 SVG
                const renderPieSVG = () => {
                    if (totalPoints30Days === 0) return <div className="w-32 h-32 rounded-full border-4 border-gray-100 flex items-center justify-center text-xs text-gray-400">尚無資料</div>;
                    let currentAngle = 0;
                    return (
                        <svg viewBox="-1.2 -1.2 2.4 2.4" className="w-32 h-32 transform -rotate-90">
                            {pieData.map((d, i) => {
                                const angle = (d.value / totalPoints30Days) * Math.PI * 2;
                                const x1 = Math.cos(currentAngle); const y1 = Math.sin(currentAngle);
                                currentAngle += angle;
                                const x2 = Math.cos(currentAngle); const y2 = Math.sin(currentAngle);
                                const largeArc = angle > Math.PI ? 1 : 0;
                                if (angle >= Math.PI * 1.99) return <circle key={i} cx="0" cy="0" r="1" fill={d.color} />;
                                return <path key={i} d={`M 0 0 L ${x1} ${y1} A 1 1 0 ${largeArc} 1 ${x2} ${y2} Z`} fill={d.color} />;
                            })}
                        </svg>
                    );
                };

                // 3. 準備兌換頻率直線圖資料
                // 解析 history 的日期並對應到 last30Days
                const historyCounts = {};
                history.forEach(item => {
                    const d = new Date(item.date);
                    if (!isNaN(d.getTime())) {
                        const dateKey = formatDateKey(d);
                        historyCounts[dateKey] = (historyCounts[dateKey] || 0) + 1;
                    }
                });

                return (
                    <div className="space-y-6">
                        {/* 貢獻圖 */}
                        <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                            <h3 className="text-lg font-bold text-gray-800 mb-4 flex items-center">
                                <Icons.Calendar className="w-5 h-5 mr-2 text-indigo-500" /> 近 30 日打卡熱力圖
                            </h3>
                            <div className="flex flex-wrap gap-1 md:gap-2">
                                {heatmapData.map((data, idx) => {
                                    let bg = "bg-gray-100";
                                    if (data.rate === 1) bg = "bg-emerald-500";
                                    else if (data.rate >= 0.5) bg = "bg-emerald-300";
                                    else if (data.rate > 0) bg = "bg-emerald-100";
                                    
                                    return (
                                        <div 
                                            key={idx} 
                                            title={`${data.date}: 達成率 ${Math.round(data.rate*100)}%`}
                                            className={`w-4 h-4 md:w-6 md:h-6 rounded-sm ${bg} hover:ring-2 ring-indigo-300 cursor-help transition-colors`}
                                        ></div>
                                    );
                                })}
                            </div>
                            <div className="flex justify-end items-center mt-3 text-xs text-gray-500 gap-1">
                                <span>少</span>
                                <div className="w-3 h-3 rounded-sm bg-gray-100"></div>
                                <div className="w-3 h-3 rounded-sm bg-emerald-100"></div>
                                <div className="w-3 h-3 rounded-sm bg-emerald-300"></div>
                                <div className="w-3 h-3 rounded-sm bg-emerald-500"></div>
                                <span>多</span>
                            </div>
                        </div>

                        {/* 兌換頻率直線 */}
                        <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-200 overflow-x-auto">
                            <h3 className="text-lg font-bold text-gray-800 mb-6 flex items-center">
                                <Icons.Gift className="w-5 h-5 mr-2 text-orange-500" /> 近 30 日兌換頻率
                            </h3>
                            <div className="relative pt-4 pb-8 min-w-[600px]">
                                {/* 軸線 */}
                                <div className="absolute top-6 left-0 right-0 h-1 bg-gray-200 rounded-full"></div>
                                
                                <div className="flex justify-between relative z-10">
                                    {last30Days.map((dateKey, idx) => {
                                        const count = historyCounts[dateKey] || 0;
                                        // 只標示每 5 天的日期文字以免太擠
                                        const showLabel = idx % 5 === 0 || idx === 29;
                                        const dayStr = dateKey.split('-')[2];
                                        
                                        return (
                                            <div key={idx} className="flex flex-col items-center group relative w-4">
                                                <div className={`w-3 h-3 rounded-full border-2 border-white shadow-sm transition-all ${
                                                    count > 0 ? 'bg-orange-500 scale-150' : 'bg-gray-300 group-hover:bg-gray-400'
                                                }`}></div>
                                                
                                                {count > 0 && (
                                                    <div className="absolute -top-6 bg-orange-100 text-orange-800 text-[10px] font-bold px-1.5 py-0.5 rounded shadow-sm whitespace-nowrap">
                                                        {count} 次
                                                    </div>
                                                )}
                                                
                                                {showLabel && (
                                                    <span className="absolute top-5 text-[10px] text-gray-400">{dayStr}</span>
                                                )}
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        </div>

                        {/* 圓餅圖 */}
                        <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                            <h3 className="text-lg font-bold text-gray-800 mb-4 flex items-center">
                                <Icons.BarChart className="w-5 h-5 mr-2 text-blue-500" /> 近 30 日點數來源
                            </h3>
                            <div className="flex flex-col sm:flex-row items-center gap-8 justify-center">
                                {renderPieSVG()}
                                <div className="space-y-3 flex-1 min-w-[200px]">
                                    {pieData.map((d, i) => (
                                        <div key={i} className="flex items-center justify-between text-sm">
                                            <div className="flex items-center gap-2">
                                                <span className="w-3 h-3 rounded-full shadow-sm" style={{backgroundColor: d.color}}></span>
                                                <span className="text-gray-700 font-medium">{d.label}</span>
                                            </div>
                                            <span className="font-bold text-gray-900">{d.value} 點 <span className="text-gray-400 font-normal text-xs">({Math.round(d.value/totalPoints30Days*100)}%)</span></span>
                                        </div>
                                    ))}
                                    {pieData.length === 0 && <p className="text-sm text-gray-400">目前沒有資料，快去打卡累積點數吧！</p>}
                                </div>
                            </div>
                        </div>
                    </div>
                );
            };

            const renderCalendar = () => {
                const year = viewDate.getFullYear();
                const month = viewDate.getMonth();
                const daysInMonth = getDaysInMonth(year, month);
                const firstDay = getFirstDayOfMonth(year, month);
                const days = [];

                for (let i = 0; i < firstDay; i++) days.push(<div key={`empty-${i}`} className="h-16 md:h-24 bg-gray-50/50"></div>);

                for (let day = 1; day <= daysInMonth; day++) {
                    const currentDayDate = new Date(year, month, day);
                    const isSelected = formatDateKey(currentDayDate) === formatDateKey(selectedDate);
                    const isToday = formatDateKey(currentDayDate) === formatDateKey(new Date());
                    const completionRate = getDailyCompletionRate(formatDateKey(currentDayDate));
                    
                    let bgClass = "bg-white";
                    if (completionRate === 1) bgClass = "bg-emerald-50 border-emerald-200";
                    else if (completionRate > 0) bgClass = "bg-orange-50 border-orange-200";

                    days.push(
                        <div key={day} onClick={() => { setSelectedDate(currentDayDate); document.getElementById('check-in-section')?.scrollIntoView({ behavior: 'smooth' }); }}
                            className={`h-16 md:h-24 border relative cursor-pointer transition-all duration-200 group flex flex-col items-center justify-start pt-2
                                ${bgClass} ${isSelected ? 'ring-2 ring-indigo-500 z-10' : 'border-gray-100 hover:bg-gray-50'}
                            `}
                        >
                            <span className={`text-sm font-medium ${isToday ? 'bg-indigo-600 text-white w-6 h-6 rounded-full flex items-center justify-center' : 'text-gray-500'}`}>{day}</span>
                            <div className="mt-2 md:mt-4 w-full px-2">
                                {habits.length > 0 && completionRate > 0 && (
                                    <div className="w-full h-1.5 bg-gray-200 rounded-full overflow-hidden">
                                        <div className={`h-full rounded-full transition-all duration-500 ${completionRate === 1 ? 'bg-emerald-500' : 'bg-orange-400'}`} style={{ width: `${completionRate * 100}%` }}></div>
                                    </div>
                                )}
                            </div>
                        </div>
                    );
                }

                return (
                    <div className="space-y-6">
                        <div className="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                            <div className="flex items-center justify-between p-4 bg-indigo-50 border-b border-indigo-100">
                                <button onClick={() => setViewDate(new Date(viewDate.getFullYear(), viewDate.getMonth() - 1, 1))} className="p-2 hover:bg-indigo-100 rounded-full"><Icons.ChevronLeft className="w-5 h-5 text-indigo-700" /></button>
                                <h2 className="text-lg font-bold text-indigo-900">{year}年 {month + 1}月</h2>
                                <button onClick={() => setViewDate(new Date(viewDate.getFullYear(), viewDate.getMonth() + 1, 1))} className="p-2 hover:bg-indigo-100 rounded-full"><Icons.ChevronRight className="w-5 h-5 text-indigo-700" /></button>
                            </div>
                            <div className="grid grid-cols-7 text-center bg-gray-50 text-xs font-semibold text-gray-500 py-2 border-b border-gray-200">
                                <div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div>
                            </div>
                            <div className="grid grid-cols-7">{days}</div>
                        </div>

                        <div id="check-in-section" className="bg-white rounded-xl shadow-lg border border-indigo-100 overflow-hidden transition-all">
                            <div className="p-4 bg-indigo-600 text-white flex justify-between items-center">
                                <h3 className="font-bold text-lg flex items-center"><Icons.Calendar className="w-5 h-5 mr-2" />{selectedDate.getMonth() + 1}月 {selectedDate.getDate()}日 的習慣</h3>
                            </div>
                            <div className="p-2">
                                {habits.length === 0 ? (
                                    <div className="text-center py-8 text-gray-400"><p>還沒有設定任何習慣，去「設定」頁面新增吧！</p></div>
                                ) : (
                                    <div className="grid grid-cols-1 gap-2">
                                        {habits.map(habit => {
                                            const isChecked = checkIns[`${habit.id}_${formatDateKey(selectedDate)}`];
                                            return (
                                                <div key={habit.id} onClick={() => toggleCheckIn(habit.id)} className={`flex items-center justify-between p-4 rounded-lg cursor-pointer transition-all border ${isChecked ? 'bg-emerald-50 border-emerald-200 shadow-sm' : 'bg-white border-gray-100 hover:bg-gray-50'}`}>
                                                    <div className="flex items-center gap-3">
                                                        <div className={`w-6 h-6 rounded-full border-2 flex items-center justify-center transition-colors ${isChecked ? 'bg-emerald-500 border-emerald-500' : 'border-gray-300'}`}>
                                                            {isChecked && <Icons.CheckCircle className="w-4 h-4 text-white" />}
                                                        </div>
                                                        <div>
                                                            <p className={`font-bold ${isChecked ? 'text-emerald-800' : 'text-gray-700'}`}>{habit.name}</p>
                                                            <p className="text-xs text-gray-500">{isChecked ? '已完成' : '未完成'} • 獎勵 {habit.points} 點</p>
                                                        </div>
                                                    </div>
                                                    <div className={`text-lg font-bold ${isChecked ? 'text-emerald-600' : 'text-gray-300'}`}>+{habit.points}</div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                );
            };

            const renderShop = () => (
                <div className="space-y-6">
                    <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                        <h3 className="text-lg font-bold text-gray-800 mb-4 flex items-center"><Icons.Gift className="w-5 h-5 mr-2 text-indigo-500" /> 兌換商店</h3>
                        <form onSubmit={addReward} className="flex flex-col sm:flex-row gap-4 bg-gray-50 p-4 rounded-lg border border-gray-100">
                            <input type="text" placeholder="輸入獎品名稱" value={newRewardName} onChange={(e) => setNewRewardName(e.target.value)} className="flex-1 px-4 py-2 border border-gray-300 rounded-lg outline-none" />
                            <div className="flex items-center gap-2">
                                <input type="number" min="1" value={newRewardCost} onChange={(e) => setNewRewardCost(e.target.value)} className="w-24 px-4 py-2 border border-gray-300 rounded-lg outline-none" />
                                <span className="text-gray-500 text-sm">點</span>
                            </div>
                            <button type="submit" className="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700">新增</button>
                        </form>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        {rewards.map(reward => (
                            <div key={reward.id} className="bg-white p-5 rounded-xl shadow-sm border border-gray-200 flex justify-between items-center">
                                <div>
                                    <h4 className="font-bold text-gray-800 text-lg">{reward.name}</h4>
                                    <p className="text-indigo-600 font-medium flex items-center mt-1"><Icons.Coins className="w-4 h-4 mr-1" /> -{reward.cost} 點</p>
                                </div>
                                <div className="flex items-center gap-2">
                                    <button onClick={() => redeemReward(reward)} className={`px-4 py-2 rounded-lg font-medium text-sm transition-colors ${points >= reward.cost ? 'bg-emerald-100 text-emerald-700 hover:bg-emerald-200' : 'bg-gray-100 text-gray-400'}`}>兌換</button>
                                    <button onClick={() => deleteReward(reward.id)} className="p-2 text-gray-300 hover:text-red-500"><Icons.Trash2 className="w-4 h-4" /></button>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );

            const renderSettings = () => (
                <div className="space-y-6">
                    <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                        <h3 className="text-xl font-bold text-gray-800 mb-4 flex items-center"><Icons.Settings className="w-5 h-5 mr-2 text-indigo-600" /> 習慣管理</h3>
                        <form onSubmit={addNewHabit} className="flex flex-col md:flex-row gap-4 mb-6 bg-indigo-50 p-4 rounded-lg">
                            <div className="flex-1">
                                <label className="block text-xs font-semibold text-indigo-600 mb-1">習慣名稱</label>
                                <input type="text" placeholder="例如: 睡前冥想" value={newHabitName} onChange={(e) => setNewHabitName(e.target.value)} className="w-full px-4 py-2 border border-indigo-200 rounded-lg outline-none" />
                            </div>
                            <div className="w-full md:w-32">
                                <label className="block text-xs font-semibold text-indigo-600 mb-1">獲得點數</label>
                                <input type="number" min="1" value={newHabitPoints} onChange={(e) => setNewHabitPoints(e.target.value)} className="w-full px-4 py-2 border border-indigo-200 rounded-lg outline-none" />
                            </div>
                            <div className="flex items-end"><button type="submit" className="w-full md:w-auto px-6 py-2 bg-indigo-600 text-white font-medium rounded-lg">新增</button></div>
                        </form>

                        <div className="space-y-3">
                            {habits.map((habit, index) => (
                                <div key={habit.id} className="flex items-center justify-between p-3 border border-gray-100 rounded-lg hover:bg-gray-50 bg-white shadow-sm">
                                    <div className="flex items-center gap-3">
                                        {/* 排序按鈕 */}
                                        <div className="flex flex-col gap-1 mr-2">
                                            <button onClick={() => moveHabit(index, 'up')} disabled={index === 0} className={`p-1 rounded ${index === 0 ? 'text-gray-200' : 'text-gray-400 hover:bg-gray-200 hover:text-gray-700'}`}><Icons.ArrowUp className="w-4 h-4" /></button>
                                            <button onClick={() => moveHabit(index, 'down')} disabled={index === habits.length - 1} className={`p-1 rounded ${index === habits.length - 1 ? 'text-gray-200' : 'text-gray-400 hover:bg-gray-200 hover:text-gray-700'}`}><Icons.ArrowDown className="w-4 h-4" /></button>
                                        </div>
                                        <span className="text-xl bg-gray-100 p-2 rounded-full w-10 h-10 flex items-center justify-center">{habit.icon || '📌'}</span>
                                        <div>
                                            <p className="font-bold text-gray-800">{habit.name}</p>
                                            <p className="text-xs text-indigo-500 font-medium">每次打卡 +{habit.points} 點</p>
                                        </div>
                                    </div>
                                    <button onClick={() => deleteHabit(habit.id)} className="p-2 text-gray-400 hover:text-red-500 bg-gray-50 rounded-lg"><Icons.Trash2 className="w-4 h-4" /></button>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );

            return (
                <div className="min-h-screen pb-24 md:pb-10 relative">
                    {toast.show && (
                        <div className={`fixed top-4 left-1/2 transform -translate-x-1/2 z-[100] px-6 py-3 rounded-full shadow-lg flex items-center gap-2 transition-all duration-300 ${toast.type === 'error' ? 'bg-red-500 text-white' : 'bg-gray-800 text-white'}`}>
                            {toast.type === 'error' ? <Icons.AlertCircle className="w-5 h-5" /> : <Icons.CheckCircle className="w-5 h-5" />}
                            <span className="font-medium">{toast.message}</span>
                        </div>
                    )}

                    {modalConfig.isOpen && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm">
                            <div className="bg-white rounded-xl shadow-2xl max-w-sm w-full p-6">
                                <h3 className="text-xl font-bold text-gray-900 mb-2">{modalConfig.title}</h3>
                                <p className="text-gray-600 mb-6">{modalConfig.message}</p>
                                <div className="flex justify-end gap-3">
                                    <button onClick={closeConfirmModal} className="px-4 py-2 rounded-lg text-gray-600 hover:bg-gray-100 font-medium">取消</button>
                                    <button onClick={modalConfig.onConfirm} className="px-4 py-2 rounded-lg bg-indigo-600 text-white hover:bg-indigo-700 font-medium">確定</button>
                                </div>
                            </div>
                        </div>
                    )}

                    <header className="bg-white border-b border-gray-200 sticky top-0 z-20 shadow-sm">
                        <div className="max-w-4xl mx-auto px-4 py-4 flex flex-row items-center justify-between">
                            <div>
                                <h1 className="text-xl font-black text-indigo-900 tracking-tight">Habit Tracker Pro</h1>
                                <p className="text-xs text-gray-500 hidden sm:block">多習慣養成 & 點數兌換系統</p>
                            </div>
                            <div className="flex items-center gap-3 bg-gradient-to-r from-yellow-50 to-orange-50 px-4 py-2 rounded-full border border-orange-100 shadow-sm">
                                <Icons.Coins className="w-5 h-5 text-orange-500" />
                                <div>
                                    <span className="text-[10px] text-orange-400 font-bold uppercase tracking-wider block leading-none">錢包餘額</span>
                                    <span className="text-lg font-bold text-orange-700 leading-none">{points}</span>
                                </div>
                            </div>
                        </div>
                    </header>

                    <main className="max-w-4xl mx-auto px-4 py-6">
                        {activeTab === 'calendar' && renderCalendar()}
                        {activeTab === 'shop' && renderShop()}
                        {activeTab === 'achievements' && renderAchievements()}
                        {activeTab === 'analytics' && renderAnalytics()}
                        {activeTab === 'settings' && renderSettings()}
                    </main>

                    {/* Mobile Navigation */}
                    <nav className="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 px-2 py-3 flex justify-around items-center z-50 md:hidden shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]">
                        {[
                            { id: 'calendar', icon: Icons.Calendar, label: '日曆' },
                            { id: 'shop', icon: Icons.Gift, label: '兌換' },
                            { id: 'achievements', icon: Icons.Award, label: '成就' },
                            { id: 'analytics', icon: Icons.BarChart, label: '分析' },
                            { id: 'settings', icon: Icons.Settings, label: '設定' }
                        ].map(tab => (
                            <button key={tab.id} onClick={() => setActiveTab(tab.id)} className={`flex flex-col items-center gap-1 w-14 ${activeTab === tab.id ? 'text-indigo-600' : 'text-gray-400'}`}>
                                <tab.icon className="w-6 h-6" />
                                <span className="text-[10px] font-medium">{tab.label}</span>
                            </button>
                        ))}
                    </nav>

                    {/* Desktop Navigation */}
                    <div className="hidden md:flex justify-center gap-4 mt-6">
                        {[
                            { id: 'calendar', label: '打卡日曆' },
                            { id: 'shop', label: '獎勵兌換' },
                            { id: 'achievements', label: '榮譽成就' },
                            { id: 'analytics', label: '數據分析' },
                            { id: 'settings', label: '習慣設定' }
                        ].map(tab => (
                            <button 
                                key={tab.id}
                                onClick={() => setActiveTab(tab.id)}
                                className={`px-6 py-2.5 rounded-full font-bold transition-all transform hover:scale-105 ${
                                activeTab === tab.id 
                                    ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-200' 
                                    : 'bg-white text-gray-500 hover:bg-gray-100 border border-gray-200'
                                }`}
                            >
                                {tab.label}
                            </button>
                        ))}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
